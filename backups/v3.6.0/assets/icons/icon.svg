<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="candleUp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="candleDown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <path d="M256 32 L448 96 V256 C448 376 364 456 256 488 C148 456 64 376 64 256 V96 Z" 
        fill="url(#shieldGrad)" 
        stroke="#60a5fa" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Shield Border Glow -->
  <path d="M256 64 L416 118 V256 C416 356 346 426 256 454 C166 426 96 356 96 256 V118 Z" 
        fill="#090d16" 
        opacity="0.75" />

  <!-- Candlestick Down (Loss) -->
  <line x1="180" y1="160" x2="180" y2="340" stroke="#f87171" stroke-width="6" stroke-linecap="round" />
  <rect x="160" y="200" width="40" height="90" rx="6" fill="url(#candleDown)" stroke="#fca5a5" stroke-width="3" />

  <!-- Candlestick Up (Rebound/Safe) -->
  <line x1="332" y1="130" x2="332" y2="320" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <rect x="312" y="160" width="40" height="110" rx="6" fill="url(#candleUp)" stroke="#6ee7b7" stroke-width="3" />

  <!-- Wash Sale Connecting Protection Arc -->
  <path d="M200 240 Q 256 160 312 215" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8" />
  <polygon points="312,215 300,205 305,225" fill="#fbbf24" />
</svg>
